<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>ماذا قال الشاعر</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #2c3e50, #3498db);
      font-family: Arial, sans-serif;
      flex-direction: column;
      color: white;
      margin: 0;
    }
    button {
      font-size: 26px;
      padding: 20px 50px;
      border: none;
      border-radius: 15px;
      background: #e74c3c;
      color: white;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.1);
      background: #c0392b;
    }
    #message {
      margin-top: 30px;
      font-size: 28px;
      font-weight: bold;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <button id="playBtn">انقر لتعرف ماذا قال الشاعر</button>
  <div id="message">هل فهمت ماذا قال الشاعر؟ ضرك روح ارقد 😴</div>

  <audio id="poemAudio" src="AUDIO.mp3"></audio>

  <script>
    const button = document.getElementById("playBtn");
    const audio = document.getElementById("poemAudio");
    const message = document.getElementById("message");

    button.addEventListener("click", () => {
      audio.play()
        .then(() => {
          button.style.display = "none";
        })
        .catch(err => {
          alert("المتصفح منع التشغيل التلقائي. اضغط مرة أخرى للموافقة.");
          console.error(err);
        });
    });

    audio.addEventListener("ended", () => {
      message.style.display = "block";
    });
  </script>
</body>
</html>
